<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generative Studio</title>
  </head>
  <body>
    <div id="studio">
      <aside id="sidebar">
        <div class="sidebar-head">
          <span class="mark"></span>
          <h1>Studio</h1>
        </div>
        <nav id="artwork-list"></nav>
        <div class="sidebar-foot">
          <span id="artwork-count"></span>
        </div>
      </aside>

      <main id="main">
        <header id="toolbar">
          <div class="tb-group tb-identity">
            <h2 id="artwork-title">—</h2>
            <span id="engine-badge" class="badge">—</span>
            <span id="version-badge" class="badge version" title="Version">—</span>
          </div>

          <div class="tb-group tb-controls">
            <label class="seed-field">
              <span>seed</span>
              <input id="seed-input" type="number" step="1" inputmode="numeric" />
            </label>
            <button id="seed-random" title="Random seed">random</button>
            <button id="reload" title="Re-run the artwork with the current seed">reload</button>
            <button id="playpause" title="Pause / play animation">pause</button>
            <a id="clean-link" target="_blank" rel="noopener" title="Open the artwork alone, with no studio chrome">clean&nbsp;↗</a>
          </div>

          <div class="tb-group tb-size">
            <label class="size-field">
              <span>aspect</span>
              <select id="aspect-select" title="Reshape the canvas at roughly the same pixel count"></select>
            </label>
            <label class="size-field">
              <span>size</span>
              <input id="width-input" type="number" step="10" min="64" max="8000" inputmode="numeric" title="Canvas width in pixels" />
            </label>
            <span class="size-x">x</span>
            <input id="height-input" type="number" step="10" min="64" max="8000" inputmode="numeric" title="Canvas height in pixels" />
            <button id="size-reset" title="Back to the size in meta.js">native</button>
          </div>
        </header>

        <div id="stage">
          <div id="artwork-root"></div>
        </div>

        <div id="status"></div>
      </main>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
